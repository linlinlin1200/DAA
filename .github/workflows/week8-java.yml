name: Week 8 BST Java
on:
  push:
    paths: ['week8/**', '.github/workflows/week8-java.yml']
  pull_request:
    paths: ['week8/**', '.github/workflows/week8-java.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: bash week8/run-tests.sh
